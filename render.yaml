services:
  # 🔵 Backend API Service
  - type: web
    name: artconnect-api
    repo: https://github.com/NickCorp/ArtConnect-Africa
    branch: main
    rootDir: backend
    runtime: docker
    region: frankfurt
    plan: starter
    healthCheckPath: /health
    
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: 3.12
      - key: JWT_ALGORITHM
        value: HS256
      - key: TOKEN_EXPIRE_MINUTES
        value: 1440
      # ⚠️ These MUST be set in Render dashboard (not in code):
      # - DATABASE_URL: postgresql://...
      # - SECRET_KEY: (generate random)
      # - CORS_ORIGINS: (your frontend URL)

  # 🟢 PostgreSQL Database Service
  - type: pserv
    name: artconnect-postgres
    plan: free
    region: frankfurt
    database: artconnect_db
    user: artconnect_user
    # Password: auto-generated by Render
    # Store password in secure location!

databases:
  - name: artconnect_db
    dbName: artconnect_db
    user: artconnect_user
    region: frankfurt
    plan: free

# Deployment hooks
hooks:
  preStart: |
    echo "🔍 Checking database connectivity..."
    python -c "import sys; from backend.database import engine; engine.execute('SELECT 1'); print('✅ Database ready')"
