version: '3.8'

services:
  backend:
    build: .
    container_name: artconnect-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - BREVO_API_KEY=${BREVO_API_KEY}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/artconnect.db}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:3000"]}
    restart: unless-stopped
